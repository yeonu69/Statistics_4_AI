<style>
:root{--bg:#F4F6F9;--card:#FFFFFF;--ink:#1B2533;--muted:#5A6676;--line:#CDD5DF;--blue:#2A66A8;--orange:#D9692A}

a.card:hover,a.card:focus-visible{border-color:var(--blue);outline:none}
